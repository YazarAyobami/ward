[package]
name = "ward"
version = "0.1.0"
edition = "2021"
description = "Ward: children's trust with cross-circle guardian rules"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces = { version = "0.24.0", features = ["unstable"] }   # VERIFY with cargo-near toolchain
tokio = { version = "1", features = ["full"] }
serde_json = "1"
