<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" style="background:#090a0f; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141721" />
      <stop offset="100%" stop-color="#0f1118" />
    </linearGradient>
    <filter id="gShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Navbar -->
  <rect x="0" y="0" width="1200" height="70" fill="#0c0e14" stroke="#1f2433" stroke-width="1" />
  <g transform="translate(48, 22)">
    <circle cx="13" cy="13" r="13" fill="#10b981" />
    <path d="M7 13 L11 17 L19 9" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="36" y="18" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="-0.5px">Ward</text>
    <text x="88" y="18" fill="#64748b" font-size="14" font-weight="500">Guardian Governance Inbox</text>
  </g>
  <g transform="translate(860, 22)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#a78bfa" />
    <text x="24" y="18" fill="#c4b5fd" font-size="12" font-weight="600">teacher (Institution)</text>
    <rect x="190" y="0" width="90" height="28" rx="14" fill="#1e293b" />
    <text x="208" y="18" fill="#94a3b8" font-size="12" font-weight="600">Trust #0</text>
  </g>

  <!-- Guardian Header Banner -->
  <g transform="translate(48, 100)" filter="url(#gShadow)">
    <rect x="0" y="0" width="1104" height="120" rx="16" fill="url(#gCardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="32" y="42" fill="#ffffff" font-size="24" font-weight="700">Governance Portal • Ada &amp; Tobi Trust</text>
    <text x="32" y="70" fill="#94a3b8" font-size="14">You are voting with the <tspan fill="#a78bfa" font-weight="600">Institution Circle</tspan> key (<tspan font-family="monospace" fill="#e2e8f0">teacher.ward-demo.testnet</tspan>)</text>

    <!-- Circle overview indicators -->
    <g transform="translate(32, 85)">
      <rect x="0" y="0" width="120" height="22" rx="11" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="12" y="15" fill="#60a5fa" font-size="11" font-weight="600">✓ Maternal (Aunt)</text>

      <rect x="130" y="0" width="120" height="22" rx="11" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="12" y="15" fill="#fbbf24" font-size="11" font-weight="600">✓ Paternal (Uncle)</text>

      <rect x="260" y="0" width="136" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.2"/>
      <text x="12" y="15" fill="#a78bfa" font-size="11" font-weight="600">✓ Institution (You)</text>

      <rect x="406" y="0" width="130" height="22" rx="11" fill="#ec4899" fill-opacity="0.2"/>
      <text x="12" y="15" fill="#f472b6" font-size="11" font-weight="600">✓ Community (Pastor)</text>
    </g>
  </g>

  <!-- Requests Section -->
  <g transform="translate(48, 246)">
    <text x="0" y="24" fill="#ffffff" font-size="20" font-weight="700">Active Expenditure Requests</text>
    <text x="0" y="46" fill="#64748b" font-size="13">Multi-circle approval required before smart contract releases funds</text>

    <!-- Card 1: School Tuition (Approved) -->
    <g transform="translate(0, 64)" filter="url(#gShadow)">
      <rect x="0" y="0" width="1104" height="180" rx="14" fill="url(#gCardGrad)" stroke="#1e293b" stroke-width="1" />
      <rect x="24" y="24" width="100" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
      <text x="36" y="40" fill="#34d399" font-size="11" font-weight="700">APPROVED</text>
      
      <text x="136" y="41" fill="#ffffff" font-size="18" font-weight="700">Payee Disbursement: Term 1 Tuition (Greenhills Academy)</text>
      <text x="960" y="42" fill="#ffffff" font-size="22" font-weight="700">350.00 <tspan fill="#10b981" font-size="16">USDC</tspan></text>

      <text x="24" y="80" fill="#94a3b8" font-size="13">Direct Payee: <tspan fill="#e2e8f0" font-family="monospace">school.testnet</tspan> • Requester: <tspan fill="#e2e8f0" font-family="monospace">uncle.ward-demo.testnet</tspan> (Caregiver)</text>
      <text x="24" y="104" fill="#94a3b8" font-size="13">Invoice SHA-256 Hash: <tspan fill="#38bdf8" font-family="monospace">4d5e6f7a8b9c...e0f1</tspan> (Verified valid school billing)</text>

      <!-- Progress bar -->
      <g transform="translate(24, 126)">
        <text x="0" y="16" fill="#64748b" font-size="12">Circle Consensus (1/1 required for whitelisted school payee)</text>
        <rect x="0" y="24" width="600" height="8" rx="4" fill="#1f2937" />
        <rect x="0" y="24" width="600" height="8" rx="4" fill="#10b981" />
        <text x="616" y="32" fill="#34d399" font-size="12" font-weight="600">✓ 100% — Executed Directly to School</text>
      </g>
    </g>

    <!-- Card 2: Rejected Medical Bills -->
    <g transform="translate(0, 268)" filter="url(#gShadow)">
      <rect x="0" y="0" width="1104" height="180" rx="14" fill="url(#gCardGrad)" stroke="#1e293b" stroke-width="1" />
      <rect x="24" y="24" width="96" height="24" rx="12" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
      <text x="36" y="40" fill="#f87171" font-size="11" font-weight="700">REJECTED</text>
      
      <text x="132" y="41" fill="#ffffff" font-size="18" font-weight="700">Large Spend: Claimed Private Clinic Medical Bill</text>
      <text x="940" y="42" fill="#ef4444" font-size="22" font-weight="700">1,500.00 <tspan fill="#f87171" font-size="16">USDC</tspan></text>

      <text x="24" y="80" fill="#94a3b8" font-size="13">Target: <tspan fill="#e2e8f0" font-family="monospace">uncle.ward-demo.testnet</tspan> (Personal Account) • Requester: Caregiver</text>
      <text x="24" y="104" fill="#f87171" font-size="13">Rejection Note: Pastor (Community Circle) flagged receipt mismatch with clinic records.</text>

      <!-- Progress bar -->
      <g transform="translate(24, 126)">
        <text x="0" y="16" fill="#64748b" font-size="12">Circle Consensus (Requires 2 distinct non-caregiver circles)</text>
        <rect x="0" y="24" width="600" height="8" rx="4" fill="#1f2937" />
        <rect x="0" y="24" width="0" height="8" rx="4" fill="#ef4444" />
        <text x="616" y="32" fill="#ef4444" font-size="12" font-weight="600">✗ Vetoed by Community Guardian</text>
      </g>
    </g>

    <!-- Emergency Controls Card -->
    <g transform="translate(0, 472)" filter="url(#gShadow)">
      <rect x="0" y="0" width="1104" height="80" rx="14" fill="url(#gCardGrad)" stroke="#374151" stroke-width="1" />
      <text x="24" y="36" fill="#f87171" font-size="16" font-weight="700">Emergency Circuit Breaker</text>
      <text x="24" y="58" fill="#94a3b8" font-size="13">Any single guardian can pause trust disbursements or veto delayed settlor withdrawals.</text>
      
      <rect x="800" y="24" width="130" height="34" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
      <text x="822" y="46" fill="#e2e8f0" font-size="13" font-weight="600">Veto Withdrawal</text>

      <rect x="946" y="24" width="130" height="34" rx="8" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1" />
      <text x="974" y="46" fill="#f87171" font-size="13" font-weight="600">Pause Trust</text>
    </g>
  </g>
</svg>
