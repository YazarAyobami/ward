# CI: lint + unit tests + sandbox integration tests on every push and PR (W-1.9).
name: ci
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown, components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-near 0.22.0 (prebuilt, checksum-verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=0.22.0; F=cargo-near-x86_64-unknown-linux-gnu.tar.gz
          gh release download "cargo-near-v$V" -R near/cargo-near -p "$F*" --clobber || {
            BASE=https://github.com/near/cargo-near/releases/download/cargo-near-v$V
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors -O "$BASE/$F"
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors -O "$BASE/$F.sha256"
          }
          echo "$(cut -d' ' -f1 "$F.sha256")  $F" | sha256sum -c -
          tar -xzf "$F"
          install -m 755 "$(find . -maxdepth 3 -type f -name cargo-near | head -1)" "$HOME/.cargo/bin/cargo-near"
          cargo near --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
